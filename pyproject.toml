[project]
name = "crusoe-triage"
version = "0.1.0"
description = "Self-improving motor claims triage agent team on Crusoe Managed Inference"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
