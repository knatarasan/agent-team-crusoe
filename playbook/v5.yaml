version: 5
rules:
- id: R1
  text: When a claim involves possible business use of a personal auto policy (delivery, rideshare, or any paid transport),
    never deny or fast-track. Route to coverage review with human sign-off.
  role: coverage
  state: all
  source_claim_ids:
  - '27'
  - '28'
  - '29'
  added_in: 1
  status: active
  score_delta: null
- id: R2
  text: When a policy cancellation or driver exclusion may be invalid due to missing notice or missing signature, do not deny
    or pay. Route to coverage review with human sign-off.
  role: coverage
  state: all
  source_claim_ids:
  - '37'
  - '25'
  added_in: 1
  status: active
  score_delta: null
- id: R3
  text: When a claim is reported more than 30 days after the loss, do not deny or pay. Route to coverage review with human
    sign-off before any payment decision.
  role: coverage
  state: all
  source_claim_ids:
  - '42'
  - '41'
  added_in: 1
  status: active
  score_delta: null
- id: R4
  text: When the insured is not at fault and subrogation is pursued, route to subrogation, not fast-track.
  role: decider
  state: all
  source_claim_ids:
  - '4'
  - '18'
  - '19'
